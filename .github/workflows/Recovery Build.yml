name: Recovery OFOX Build (fox_14.1)

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL (repo sync RESMI OrangeFox Recovery Project -- fox_14.1 didukung langsung di sini, tidak perlu fork pihak ketiga seperti percobaan fox_16.0 sebelumnya)'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/kingD2N/device_xiaomi_ingres_recovery'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH (branch "TWRP" MEMANG sengaja dipakai jadi sumber build OrangeFox juga -- lihat README.md tree ini: "Nama TWRP di sini murni penamaan branch, bukan penanda jenis recovery". Dikonfirmasi dari isi zip yang di-upload, bukan asumsi.)'
        required: true
        default: 'OFOX'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/ingres'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (opsional — kosongkan kalau device tree ingres berdiri sendiri tanpa -common tree, seperti saat ini)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (isi kalau COMMON_TREE_URL diisi)'
        required: false
      COMMON_TREE_BRANCH:
        description: 'COMMON_TREE_BRANCH (opsional — kalau dikosongkan, clone pakai branch default repo COMMON_TREE_URL itu sendiri. JANGAN asumsikan sama dengan DEVICE_TREE_BRANCH, karena tidak ada jaminan keduanya pakai penamaan branch yang sama)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'ingres'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME (nama produk polos, mis. twrp_ingres. Step build coba format lunch lama 2-bagian dulu; kalau tree ini ternyata juga pakai sistem release-config baru seperti fox_16.0, otomatis lanjut ke format 3-bagian product-release-variant)'
        required: true
        default: 'twrp_ingres'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'
      OF_MAINTAINER:
        description: 'OF_MAINTAINER (nama yang tampil di recovery)'
        required: true
        default: 'D2N'
      FOX_MAINTAINER_PATCH_VERSION:
        description: 'FOX_MAINTAINER_PATCH_VERSION — ISI ANGKA POLOS SAJA (contoh: 1, 2, 3). Ini otomatis JADI suffix, jangan isi versi lengkapnya sendiri (isi "2", bukan "R11.4_2")'
        required: true
        default: '1'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:

    # You might want to Checkout your repo first, but not mandatory
    - name: Check Out
      uses: actions/checkout@v4

    # fox_14.1 butuh disk jauh lebih besar daripada fox_12.1 (dokumentasi resmi OrangeFox:
    # minimal 85GB, vs 45GB untuk fox_12.1). Runner GitHub cuma ~14GB bebas dari awal, jadi
    # ini sapuan paling agresif duluan -- buang Android SDK/NDK, .NET, Haskell/GHC, image
    # Docker, dan paket besar bawaan runner. "android: true" aman: itu SDK/NDK bawaan runner
    # untuk build app Gradle, BUKAN source AOSP yang baru di-sync belakangan di step lain.
    - name: Free disk space (pre-cleanup)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Disk space check (setelah cleanup)
      run: |
        echo "== df -h setelah free-disk-space + slimhub =="
        df -h

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            git python3 tar aria2
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # fox_14.1 = basis Android 14. Google baru mewajibkan JDK 17 untuk build AOSP mulai
    # sekitar masa transisi Android 14 ("Trunk Stable Project" dimulai dari Android 14,
    # bukan baru di 16). JDK 11 (dipakai workflow fox_12.1 lama) kemungkinan tidak cukup di
    # sini. Ini penyesuaian berbasis analisis, bukan hasil compile langsung -- kalau build
    # log minta versi lain, kabari saya. (fox_16.0 kemarin butuh JDK 21 secara spesifik,
    # tapi itu manifest Android 16 yang jauh lebih baru dari basis fox_14.1 ini.)
    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.SYNC_URL, 'git@') || 
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync OrangeFox sources and minimal manifest
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone ${{ github.event.inputs.SYNC_URL }} sync
        cd sync
        TARGET=${{ steps.pwd.outputs.workspace-folder }}/fox_14.1
        success=0
        for attempt in 1 2 3 4 5; do
          echo "== Sync attempt $attempt/5 =="
          ./orangefox_sync.sh --branch 14.1 --path "$TARGET" || true
          # orangefox_sync.sh terbukti exit 0 bahkan saat --branch tidak dikenali (lihat
          # riwayat percobaan fox_16.0 sebelumnya) -- exit code sendirian TIDAK bisa
          # dipercaya. "14.1" seharusnya dikenali script resmi ini (beda dari 16.0 yang
          # butuh fork pihak ketiga), tapi verifikasi manual tetap dipertahankan: build/
          # envsetup.sh wajib ada kalau manifest benar-benar ter-sync (dan memang dibutuhkan
          # lagi nanti di step "Building recovery"). Skrip resminya sendiri memperingatkan
          # fox_14.1 EXPERIMENTAL dan sync-nya bisa sangat lama -- lima kali percobaan retry
          # di bawah bukan cuma jaga-jaga jaringan, tapi juga jaga-jaga sync yang lama itu.
          if [ -f "$TARGET/build/envsetup.sh" ]; then
            success=1
            break
          fi
          echo "Sync attempt $attempt tidak menghasilkan manifest yang valid (build/envsetup.sh tidak ada). Retry in 30s..."
          sleep 30
        done
        if [ "$success" -ne 1 ]; then
          echo "::error::Semua percobaan sync gagal -- $TARGET/build/envsetup.sh tidak pernah ada."
          exit 1
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # Diagnostik ringan: kalau step berikutnya gagal karena kehabisan ruang/RAM, angka
    # pastinya langsung kelihatan di log tanpa perlu menebak.
    - name: Check disk & memory after sync
      if: always()
      run: |
        echo "== Disk =="
        df -h
        echo "== Memory =="
        free -h
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_14.1
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Patch device.mk (restrukturisasi build/make + release-config)
      run: |
        DM=${{ steps.pwd.outputs.workspace-folder }}/fox_14.1/${{ github.event.inputs.DEVICE_PATH }}/device.mk

        # (1) gsi_keys.mk -> developer_gsi_keys.mk
        # device.mk kalian mereferensikan build/make/target/product/gsi_keys.mk. Nama itu
        # TERBUKTI berubah jadi developer_gsi_keys.mk di source terbaru (restrukturisasi
        # Google per Jun 2025) -- dikonfirmasi dari DUA reference tree resmi OrangeFox
        # (sm8450-common fox_14.1 MAUPUN fox_16.0), keduanya sudah pakai nama baru ini.
        # Diarahkan ke nama baru (bukan sekadar di-skip) supaya fungsinya (gsi keys di
        # ramdisk) tetap terpasang. Tetap pakai inherit-product-if-exists sebagai jaring
        # pengaman kalau source spesifik yang di-sync belum ikut berubah.
        if [ -f "$DM" ] && grep -q 'inherit-product, \$(SRC_TARGET_DIR)/product/gsi_keys.mk)' "$DM"; then
          sed -i 's#inherit-product, \$(SRC_TARGET_DIR)/product/gsi_keys.mk)#inherit-product-if-exists, $(SRC_TARGET_DIR)/product/developer_gsi_keys.mk)#' "$DM"
          echo "Dipatch (gsi_keys.mk -> developer_gsi_keys.mk): $DM"
        else
          echo "::notice::Baris gsi_keys.mk tidak ditemukan (atau sudah beda formatnya) -- lewati."
        fi

        # (2) BOARD_API_LEVEL bentrok dengan release-config (TEMUAN BARU dari build gagal):
        # device.mk kalian set "BOARD_API_LEVEL := 31" langsung. Begitu manifest pakai sistem
        # release-config (lunch dengan "ap2a", dst), build/make/core/board_config.mk MELARANG
        # BOARD_API_LEVEL diset manual kalau RELEASE_BOARD_API_LEVEL sudah terisi -- errornya
        # persis: "BOARD_API_LEVEL must not set manully" (dikonfirmasi dari source asli AOSP,
        # build/make/core/board_config.mk sekitar baris 1000). Baris itu dibungkus ifndef supaya
        # HANYA berlaku kalau RELEASE_BOARD_API_LEVEL belum ada (manifest lama tanpa
        # release-config, misalnya fox_12.1) -- di manifest baru, baris ini otomatis tidak aktif
        # dan nilainya diambil alih otomatis oleh build system dari release config ("ap2a").
        if [ -f "$DM" ] && grep -q '^BOARD_API_LEVEL := ' "$DM" && ! grep -q 'ifndef RELEASE_BOARD_API_LEVEL' "$DM"; then
          sed -i 's/^BOARD_API_LEVEL := \(.*\)$/ifndef RELEASE_BOARD_API_LEVEL\nBOARD_API_LEVEL := \1\nendif/' "$DM"
          echo "Dipatch (BOARD_API_LEVEL dibungkus ifndef RELEASE_BOARD_API_LEVEL): $DM"
        else
          echo "::notice::Baris BOARD_API_LEVEL tidak ditemukan (atau sudah dipatch) -- lewati."
        fi

        echo "== device.mk setelah dipatch =="
        cat "$DM" 2>/dev/null | head -60

    - name: Clone common tree
      # CATATAN PERBAIKAN: versi workflow paling lama selalu pakai DEVICE_TREE_BRANCH juga
      # untuk clone common tree (tidak ada input branch terpisah). Itu cuma "aman" selama
      # COMMON_TREE_URL kosong (kondisi default kalian saat ini). Begitu diisi sungguhan,
      # kalau branch common tree-nya beda nama dari branch device tree, clone ini gagal fatal
      # dan job berhenti. Sekarang dipisah jadi COMMON_TREE_BRANCH sendiri -- kalau
      # dikosongkan, git clone tanpa -b sehingga otomatis memakai default branch repo tersebut.
      if: |
        github.event.inputs.COMMON_TREE_URL != ''
        && github.event.inputs.COMMON_PATH != ''
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_14.1
        if [ -n "${{ github.event.inputs.COMMON_TREE_BRANCH }}" ]; then
          git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.COMMON_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
        else
          git clone ${{ github.event.inputs.COMMON_TREE_URL }} ./${{ github.event.inputs.COMMON_PATH }}
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Workaround known-broken modules unrelated to recovery
      run: |
        # Patch openaes di bawah terverifikasi perlu untuk fox_12.1 (toolchain-nya tidak kenal
        # warning group "-Wdeprecated-non-prototype" tanpa "-Wunknown-warning-option" didaftar
        # lebih dulu, jadi jadi error -Werror). Untuk fox_14.1 belum diverifikasi apakah masih
        # relevan -- makanya tiap langkah di bawah cek dulu apakah file/folder targetnya ADA
        # sebelum diubah, supaya kalau strukturnya sudah beda, langkah ini otomatis jadi no-op
        # (bukan membuat folder baru yang sebenarnya tidak pernah ada di manifest ini, dan
        # bukan error/warning fatal). Kalau build.log menunjukkan error deprecated-non-prototype
        # /unknown-warning-option di path lain, tambahkan path itu di sini.
        TREE=${{ steps.pwd.outputs.workspace-folder }}/fox_14.1

        if [ -d "$TREE/external/se_omapi" ]; then
          rm -rf "$TREE/external/se_omapi"
          mkdir -p "$TREE/external/se_omapi"
          printf 'soong_namespace {\n}\n' > "$TREE/external/se_omapi/Android.bp"
          echo "Distub: $TREE/external/se_omapi"
        else
          echo "::notice::external/se_omapi tidak ada di fox_14.1 -- lewati"
        fi

        if [ -d "$TREE/hardware/interfaces/vibrator/aidl/default/example_java_client" ]; then
          rm -rf "$TREE/hardware/interfaces/vibrator/aidl/default/example_java_client"
          echo "Dihapus: hardware/interfaces/vibrator/aidl/default/example_java_client"
        fi

        for f in \
          bootable/recovery/openaes/src/oaes_lib.c \
          bootable/recovery/openaes/src/isaac/rand.h \
          bootable/recovery/openaes/src/isaac/rand.c
        do
          F="$TREE/$f"
          if [ -f "$F" ]; then
            if ! grep -q 'Wunknown-warning-option' "$F"; then
              sed -i '1i #pragma clang diagnostic ignored "-Wunknown-warning-option"\n#pragma clang diagnostic ignored "-Wdeprecated-non-prototype"' "$F"
              echo "Patched: $F"
            else
              echo "$F sudah dipatch sebelumnya, lewati"
            fi
          else
            echo "::notice::$F tidak ditemukan di fox_14.1 -- kemungkinan struktur source openaes sudah berubah dari fox_12.1, atau masalah ini memang sudah tidak ada di manifest ini. Aman diabaikan."
          fi
        done
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # Ukuran swap SENGAJA TIDAK dinaikkan meski dokumentasi OrangeFox menyebut 32GB RAM
    # minimum untuk fox_14.1 -- swap file dari pierotofy ini memakan ruang DISK, dan disk
    # (bukan RAM) yang jadi risiko paling kritis di sini (lihat catatan disk-space di
    # step-step sebelumnya: fox_14.1 minimal 85GB, runner cuma ~14GB bebas di awal).
    # Menaikkan swap di sini cuma memperparah risiko yang justru paling berbahaya. Untuk RAM
    # virtual tambahan, zram di bawah (berbasis kompresi RAM, tidak memakan disk) menambah
    # ~50% kapasitas RAM efektif tanpa mengorbankan ruang build.
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Enable zram swap
      run: |
        sudo apt-get update
        sudo apt-get install -y zram-tools
        echo -e 'ALGO=lz4\nPERCENT=50\nPRIORITY=100' | sudo tee /etc/default/zramswap
        sudo systemctl restart zramswap.service
        echo "== swap layout =="
        swapon --show
        free -h
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # Cek disk PERSIS sebelum tahap terberat (build). Kalau nanti build gagal dengan "No
    # space left on device", angka di sini + di build.log adalah bukti pertama yang dicek.
    - name: Disk space check (sebelum build)
      run: |
        echo "== df -h =="
        df -h
        echo "== 20 folder terbesar di source tree =="
        du -sh ${{ steps.pwd.outputs.workspace-folder }}/fox_14.1/* 2>/dev/null | sort -rh | head -20
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_14.1
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        export OF_MAINTAINER="${{ github.event.inputs.OF_MAINTAINER }}"
        export FOX_MAINTAINER_PATCH_VERSION="${{ github.event.inputs.FOX_MAINTAINER_PATCH_VERSION }}"
        # Sama seperti workflow fox_12.1 sebelumnya: fokus ke varian HyperOS (kernel/vendor
        # gaya stock MIUI/HyperOS, FOX_VANILLA_BUILD=0) karena device tree ingres saat ini
        # memang didesain untuk itu. Kalau suatu saat mau build varian vanilla/GKI murni
        # untuk ROM custom Android 14+ (mis. PixelOS/Lineage berbasis GKI), dua baris
        # FOX_VARIANT / FOX_VANILLA_BUILD di bawah ini yang perlu diubah (FOX_VANILLA_BUILD=1)
        # -- kabari saya kalau mau saya jadikan input workflow supaya tidak perlu edit YAML.
        export FOX_VARIANT="HyperOS"
        export FOX_VANILLA_BUILD=0
        # OF_SCREEN_H juga sudah ditaruh di vendorsetup.sh (tempat yang benar secara permanen),
        # tapi diulang eksplisit di sini juga sebagai jaring pengaman -- vendorsetup.sh device
        # ini punya syarat pengecekan ($1/$FOX_BUILD_DEVICE harus cocok "ingres") yang TIDAK
        # terjamin selalu terpicu saat envsetup.sh source otomatis di CI. Layar 1080x2400 = 20:9.
        export OF_SCREEN_H=2400

        PRODUCT="${{ github.event.inputs.MAKEFILE_NAME }}"
        VARIANT="eng"

        # fox_14.1 SEHARUSNYA lebih sederhana dari percobaan fox_16.0 kemarin (format lunch
        # lama 2-bagian "product-variant" kemungkinan masih berlaku, sama seperti fox_12.1),
        # tapi contoh nyata dari device tree lain di komunitas ("lunch twrp_PJZ110-ap2a-eng")
        # menunjukkan fox_14.1 TERNYATA juga sudah pakai sistem release-config 3-bagian
        # (product-release-variant) -- "ap2a"/"ap1a" adalah kode Build ID Android 14
        # QPR3/QPR2, beda dari kode "bp*" yang dipakai Android 16 kemarin. Coba format lama
        # dulu (murah, cepat gagal kalau memang tidak berlaku), baru lanjut ke 3-bagian
        # dengan urutan: alias dari release_config_map.textproto milik tree ini sendiri
        # (paling tahan terhadap source yang berubah) -> ap2a/ap1a (dikonfirmasi jalan di
        # device tree lain) -> ap3a/ap4a (jaga-jaga kalau manifest sedikit lebih baru).
        LUNCH_OK=0
        COMBO2="${PRODUCT}-${VARIANT}"
        echo "== Mencoba format lama: lunch $COMBO2 =="
        if lunch "$COMBO2"; then
          echo "lunch berhasil dengan format 2-bagian lama"
          LUNCH_OK=1
        else
          echo "Format 2-bagian gagal. Mencoba format 3-bagian (product-release-variant)..."

          MAPFILE="build/release/release_config_map.textproto"
          ALIAS_NAMES=""
          ALIAS_TARGETS=""
          if [ -f "$MAPFILE" ]; then
            echo "== Isi $MAPFILE =="
            cat "$MAPFILE"
            ALIAS_NAMES=$(grep -A2 --no-group-separator 'aliases:' "$MAPFILE" 2>/dev/null | grep 'name:' | sed 's/.*name: *"\([^"]*\)".*/\1/' | sort -u)
            ALIAS_TARGETS=$(grep -A2 --no-group-separator 'aliases:' "$MAPFILE" 2>/dev/null | grep 'target:' | sed 's/.*target: *"\([^"]*\)".*/\1/' | sort -u)
            echo "Nama alias ditemukan di tree: ${ALIAS_NAMES:-(tidak ada)}"
            echo "Target alias ditemukan di tree: ${ALIAS_TARGETS:-(tidak ada)}"
          else
            echo "$MAPFILE tidak ada di path standar ini."
          fi

          RELEASES=$(echo "$ALIAS_NAMES $ALIAS_TARGETS ap2a ap1a ap3a ap4a trunk_staging" | tr ' ' '\n' | awk 'NF && !seen[$0]++' | tr '\n' ' ')
          echo "Urutan release yang akan dicoba: $RELEASES"

          for REL in $RELEASES; do
            COMBO3="${PRODUCT}-${REL}-${VARIANT}"
            echo "== Mencoba: lunch $COMBO3 =="
            if lunch "$COMBO3"; then
              echo "lunch berhasil dengan release '$REL'"
              LUNCH_OK=1
              break
            fi
            echo "Release '$REL' gagal, coba kandidat berikutnya..."
          done
        fi

        if [ "$LUNCH_OK" -ne 1 ]; then
          echo "::error::Semua percobaan lunch gagal (format lama, lalu format baru dengan berbagai nama release)."
          MAPFILE="build/release/release_config_map.textproto"
          echo "== Isi out/soong/release-config/all_release_configs-${PRODUCT}.textproto (kalau sempat dibuat, dibatasi 100 baris) =="
          head -100 "out/soong/release-config/all_release_configs-${PRODUCT}.textproto" 2>/dev/null || echo "(belum/tidak dibuat)"
          echo "== Isi $MAPFILE (kalau ada) =="
          cat "$MAPFILE" 2>/dev/null || echo "(tidak ada)"
          echo "== Daftar file *release_config_map*.textproto lain di tree (nama saja, dibatasi 100 -- SENGAJA tidak diisi biar log tidak meledak) =="
          find . -iname "*release_config_map*textproto*" 2>/dev/null | grep -vF "$MAPFILE" | head -100
          exit 1
        fi

        set -e
        set -o pipefail
        ( make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all) ) 2>&1 | tee ${{ steps.pwd.outputs.workspace-folder }}/build.log
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload build log (jika build gagal)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_id }}
        path: ${{ steps.pwd.outputs.workspace-folder }}/build.log
        retention-days: 7

    - name: Verify build artifacts
      run: |
        OUT_DIR="${{ steps.pwd.outputs.workspace-folder }}/fox_14.1/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        echo "== Isi $OUT_DIR =="
        ls -al "$OUT_DIR"
        shopt -s nullglob
        imgs=("$OUT_DIR"/*.img)
        zips=("$OUT_DIR"/*.zip)
        echo "Ditemukan ${#imgs[@]} file .img dan ${#zips[@]} file .zip"
        if [ ${#imgs[@]} -eq 0 ] && [ ${#zips[@]} -eq 0 ]; then
          echo "::error::Tidak ada file .img atau .zip di $OUT_DIR — build tidak menghasilkan output apa pun."
          exit 1
        fi

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/fox_14.1/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          ${{ steps.pwd.outputs.workspace-folder }}/fox_14.1/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: ${{ github.event.inputs.DEVICE_NAME }}-fox14-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        fail_on_unmatched_files: true
        body: |
          Manifest: fox_14.1
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
          Variant: HyperOS
          Maintainer: ${{ github.event.inputs.OF_MAINTAINER }} (patch ${{ github.event.inputs.FOX_MAINTAINER_PATCH_VERSION }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
